<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not here | Endless Library</title>
<meta name="robots" content="noindex">
<script>
  /* GitHub Pages can't do server-side redirects, so this page is the
     forwarder for paths that used to belong to Discourse when the forum lived
     on the apex domain. Anything else that doesn't exist goes to the link
     below. */
  var FORUM = 'https://shush.endlesslibrary.com.au';
  var FORUM_PATHS = /^\/(t|c|u|g|tag|tags|badges|categories|latest|top|new|unread|hot|login|signup|session|invites|my|admin|about|faq|guidelines|tos|privacy|upcoming-events|uploads|user_avatar|letter_avatar)(\/|$)/;
  var ELSEWHERE = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';

  if (FORUM_PATHS.test(location.pathname)) {
    location.replace(FORUM + location.pathname + location.search + location.hash);
  } else {
    location.replace(ELSEWHERE);
  }
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://www.youtube.com/watch?v=dQw4w9WgXcQ"></noscript>
</head>
<body>
<p><a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">This page isn't here. Click for what you're looking for.</a></p>
</body>
</html>
